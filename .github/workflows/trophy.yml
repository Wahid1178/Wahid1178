name: generate trophy (deno)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout own repo
        uses: actions/checkout@v4

      - name: checkout trophy source
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          path: trophy-src

      - name: setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: generate svg
        working-directory: trophy-src
        env:
          GITHUB_TOKEN1: ${{ secrets.TROPHY_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.TROPHY_TOKEN }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts Wahid1178 ../output tokyonight
          
      - name: rename output
        run: mv output trophy.svg

      - name: commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "update trophy"
          git push
